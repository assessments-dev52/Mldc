  .rblock h3{margin:.1em 0 .3em;color:var(--c);font-size:1.2rem}

  .status.wait{background:#EEF1F7;color:var(--muted)}
  .status.err{background:#FDECEA;color:#9B2C1F}

</style>
</head>

/* =========================================================
   3) SCORING — each returns {headline, sub, scores, blocks[]}
   ========================================================= */
const sumBy = (it, ans, key) => it.reduce((a, q, i) => a + (q.k === key ? ans[i] : 0), 0);
const count = (ans, v) => ans.filter(x => x === v).length;
const band = (v, bands) => bands.find(b => v >= b[0] && v <= b[1]);

const SCORE = {
"1.1"(a, ans){
  const L = "ABCD", c = [0,1,2,3].map(i => count(ans, i));
  const styles = [
    ["The Director","You give clear direction, move fast and deliver results. People always know what to do.","Your strength becomes a weakness when people stop thinking for themselves. Once a week, ask \"What do you suggest?\" before giving your answer."],
    ["The Visionary","You inspire people with a picture of the future and a sense of purpose.","A vision needs a plan. Turn your big picture into three clear priorities and check progress every month."],
    ["The Coach","You grow people. You listen, ask questions and invest in their development.","Coaching takes time; in a crisis people need direction. Learn to switch to a clear \"do this now\" when speed matters."],
    ["The Collaborator","You involve people, build consensus and create ownership.","Not every decision needs a meeting. Agree with your team which decisions you'll make alone and which you'll make together."]];
  const max = Math.max(...c), top = c.map((v,i)=>v===max?i:-1).filter(i=>i>=0);
  const order = [0,1,2,3].sort((x,y)=>c[y]-c[x]);
  const scores = {A_Director:c[0],B_Visionary:c[1],C_Coach:c[2],D_Collaborator:c[3]};
  let headline, sub, blocks = [];
  if (max <= 3) {
    headline = "The Adapter"; sub = "No style above 3 — you change style depending on the situation.";
    blocks.push({chip:"Your result",label:"The Adapter",meaning:"Flexibility is your strength.",tip:"Make sure your team can still predict how you'll react. Explain why you are switching style."});
  } else if (top.length > 1) {
    headline = "Blended: " + top.map(i=>styles[i][0].replace("The ","")).join(" + ");
    sub = "You use two (or more) styles naturally.";
    blocks.push({chip:"Your result",label:"A blended leader",meaning:"Two styles came out equally strong.",tip:"Notice which situations trigger each style — and whether that choice serves the team or just your comfort."});
    top.forEach(i => blocks.push({chip:"Style "+L[i]+" · "+c[i]+" answers",label:styles[i][0],meaning:styles[i][1],tip:styles[i][2]}));
  } else {
    const m = order[0], b = order[1];
    headline = styles[m][0]; sub = "Main style " + L[m] + " (" + c[m] + " answers) · back-up style: " + styles[b][0] + " (" + c[b] + ")";
    blocks.push({chip:"Main style · "+c[m]+" answers",label:styles[m][0],meaning:styles[m][1],tip:styles[m][2]});
    blocks.push({chip:"Back-up style · "+c[b]+" answers",label:styles[b][0],meaning:styles[b][1],tip:styles[b][2]});
  }
  blocks.push({chip:"Across cultures",label:"Where your style travels",meaning:"Directors are often accepted in high power-distance countries (Egypt, Saudi Arabia, India); Coaches and Collaborators fit low power-distance countries (Sweden, Netherlands). Visionaries work almost everywhere if the story is told in local terms."});
  return {headline, sub, scores, blocks, bars:[["Director (A)",c[0],10],["Visionary (B)",c[1],10],["Coach (C)",c[2],10],["Collaborator (D)",c[3],10]]};
},
"1.2"(a, ans){
  const S = sumBy(a.items, ans, "S"), F = sumBy(a.items, ans, "F");
  let r;
  if (S <= 12 && F <= 12) r = ["\"Inspire me\"","Structure and freedom matter less to you than meaning and relationships.","Tell your manager what motivates you — purpose, recognition, learning — so they can lead you well."];
  else if (S - F >= 3) r = ["\"Guide me\"","You work best with clear direction, structure and a manager who decides.","Tell your manager what clarity you need — goals, deadlines, priorities. Also practise taking one decision a week on your own."];
  else if (F - S >= 3) r = ["\"Trust me\"","You work best with autonomy and a manager who sets the goal, then steps back.","Earn freedom by being predictable: send a short weekly update so your manager doesn't feel the need to check on you."];
  else r = ["\"Partner with me\"","You want a balance: clear goals, a voice in decisions and freedom in how you work.","Agree with your manager up front: \"Where do you want me to ask first, and where can I just act?\""];
  return {headline:r[0], sub:"Structure " + S + " · Freedom " + F, scores:{Structure:S,Freedom:F},
    blocks:[{chip:"Your result",label:r[0],meaning:r[1],tip:r[2]},{chip:"Golden rule",label:"Do you lead others the way you want to be led?",meaning:"Most people do. Compare with your Leadership Style (1.1): do you give your team what you want — or what they need?"}],
    bars:[["Structure",S,25],["Freedom",F,25]]};

"1.3"(a, ans){
  const T = sumBy(a.items, ans, "T"), P = sumBy(a.items, ans, "P"), th = T >= 18, ph = P >= 18;
  const map = {
    "11":["The Team Builder","You deliver results and care for people — the ideal balance.","Protect this balance under pressure, when most leaders slide to task only. Keep one-to-ones even in busy weeks."],

    "00":["The Bystander","You may be overloaded, disengaged or new to leading.","Choose one task habit and one people habit and practise them for 30 days. Ask a mentor for support."]};
  const r = map[(th?1:0)+""+(ph?1:0)];
  return {headline:r[0], sub:"Task " + T + (th?" (high)":" (low)") + " · People " + P + (ph?" (high)":" (low)"), scores:{Task:T,People:P},
    blocks:[{chip:"Your result",label:r[0],meaning:r[1],tip:r[2]},{chip:"Across cultures",label:"Task-first or people-first?",meaning:"Task-first leadership is common in the USA, Germany and Switzerland; people-first leadership is expected in Egypt, the Gulf, Latin America and much of Asia, where trust comes before business."}],
    bars:[["Task",T,25,18],["People",P,25,18]]};
},

},
"2.1"(a, ans, extra){
  const keys = ["PDI","IDV","MAS","UAI","LTO","IVR"];
  const info = {
    PDI:["Hierarchical — respect the boss, decisions come from the top","Egalitarian — flat, consultative, the boss is accessible","Working with a low-PDI culture: invite open challenge and don't over-rely on titles.","Working with a high-PDI culture: respect titles, disagree in private, go through the right levels."],
    IDV:["\"I\" culture — personal achievement, direct speech","\"We\" culture — group loyalty, harmony, relationships","Working with a \"we\" culture: build relationships first and praise the team.","Working with an \"I\" culture: be direct, recognize individuals, separate work from personal ties."],
    MAS:["Competitive — winning, achievement, status","Cooperative — consensus, quality of life, caring","Working with a cooperative culture: soften targets and value wellbeing.","Working with a competitive culture: show ambition and results; don't be shy about success."],
    UAI:["Rule-loving — plans, detail, stability","Flexible — comfortable with ambiguity and change","Working with a flexible culture: allow experiments and quick changes.","Working with a rule-loving culture: give detail, plans and clear rules before changing anything."],
    LTO:["Long-term — patience, perseverance, the future","Short-term — tradition, quick results","Working with a short-term culture: show quick wins along the way.","Working with a long-term culture: explain the 5–10 year view and be patient."],
    IVR:["Indulgent — enjoyment, leisure, optimism","Restrained — discipline, strict norms","Working with a restrained culture: be more formal and reserved.","Working with an indulgent culture: allow celebrations, humor and work-life balance."]};
  const country = extra.country || "";
  const off = HOF[country];
  const scores = {Country:country}, blocks = [], bars = [];
  let highs = [];
  keys.forEach((k, i) => {

    if (lvl === "High") highs.push(DIMS[i]);

    const tip = lvl === "High" ? info[k][2] : lvl === "Low" ? info[k][3] : "Watch for differences inside your country (region, generation, industry) — and read each partner as an individual.";
    blocks.push({chip:DIMS[i] + " · " + v + "/15 · " + lvl, label:lvl === "Medium" ? "Medium" : meaning.split(" — ")[0], meaning, tip});
    bars.push([DIMS[i], Math.round((v - 3) / 12 * 100), 100, off ? off[i] : null]);

    sub:"Bars show your answers on a 0–100 scale; the gold marker is the official Hofstede score" + (off ? "." : " (choose a listed country to see it)."),
    scores, blocks, bars, barsPct:true};

   ========================================================= */
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let MEM = {user:null, results:{}, queue:[]};
const getUser = () => LS.get("mldc_user", MEM.user);
const setUser = u => { MEM.user = u; LS.set("mldc_user", u); };
const getResults = () => LS.get("mldc_results", MEM.results);
const saveResult = (id, r) => { const all = getResults(); all[id] = r; MEM.results = all; LS.set("mldc_results", all); };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
let state = {day:1, view:"home", aid:null, ans:[], extra:{}};

function setDayColors(d){
  const r = document.documentElement.style;
  r.setProperty("--c", "var(" + DAYS[d].c + ")"); r.setProperty("--ct", "var(" + DAYS[d].ct + ")");
}

/* =========================================================
   5) SUBMISSION TO GOOGLE SHEETS
   ========================================================= */
function submit(payload){
  const q = LS.get("mldc_queue", MEM.queue); q.push(payload); MEM.queue = q; LS.set("mldc_queue", q);
  return flush();
}
async function flush(){
  const q = LS.get("mldc_queue", MEM.queue);
  if (!q.length) return {ok:true};
  if (!CONFIG.SCRIPT_URL || CONFIG.SCRIPT_URL.indexOf("http") !== 0) return {ok:false, msg:"Results are saved on this device. (The Google Sheet link has not been set up yet.)"};
  const left = [];
  for (const p of q) {
    try {
      await fetch(CONFIG.SCRIPT_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(p)});
    } catch(e) { left.push(p); }
  }
  MEM.queue = left; LS.set("mldc_queue", left);
  return left.length ? {ok:false, msg:"No connection — your result is saved and will be sent automatically next time."} : {ok:true};
}

    <button class="acard" data-id="${x.id}">
      ${res[x.id] ? `<span class="done res">✓ ${esc(res[x.id].headline)}</span>` : ""}
      <span class="badge">${x.id}</span>
      <h3>${x.title}</h3><p>${x.blurb}</p><p><small>⏱ ${x.time} min</small></p>
    </button>`).join("")}</div>`;
  app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.day=+b.dataset.d; render(); scrollTo(0,0);});
  app.querySelectorAll(".acard").forEach(b=>b.onclick=()=>openA(b.dataset.id));
  flush();
}

function openA(id){
  const a = A.find(x=>x.id===id);
  state = {...state, view:"assess", aid:id, day:a.day, ans:new Array(a.items.length).fill(null), extra:{country:(getUser()||{}).country||""}};
  if (a.type === "reflect") state.ans = state.ans.map(()=> "");
  render(); scrollTo(0,0);
}

function renderAssess(){
  const a = A.find(x=>x.id===state.aid), letters = a.letters || "ABCD";
  let qs = "";
  a.items.forEach((q,i)=>{
    const n = i + 1;
    if (a.type === "scale") {
      qs += `<div class="q" id="q${i}"><div class="qt"><span class="qn">${n}</span><span>${q.t}</span></div>
        <div class="scale">${Array.from({length:a.n},(_,v)=>`<button data-i="${i}" data-v="${v+1}" aria-label="${v+1}">${v+1}</button>`).join("")}</div>
        <div class="ends"><span>${a.ends[0]}</span><span>${a.ends[1]}</span></div></div>`;
    } else if (a.type === "choice") {
      qs += `<div class="q" id="q${i}"><div class="qt"><span class="qn">${n}</span><span>${q.t}</span></div>
        <div class="opts">${q.o.map((o,v)=>`<button class="opt" data-i="${i}" data-v="${v}"><span class="L">${letters[v]}</span><span>${o}</span></button>`).join("")}</div></div>`;
    } else if (a.type === "pair") {
      const head = a.id === "2.3" && (i === 0 || i === 6) ? `<h3 style="margin:18px 0 4px">${i===0?"Part A — How I communicate":"Part B — How I treat time"}</h3>` : "";
      qs += head + `<div class="q" id="q${i}"><div class="qt"><span class="qn">${n}</span><span>Which describes you better?</span></div>
        <div class="opts two">${q.map((o,v)=>`<button class="opt" data-i="${i}" data-v="${v}"><span class="L">${"AB"[v]}</span><span>${o}</span></button>`).join("")}</div></div>`;
    } else if (a.type === "quiz") {
      qs += `<div class="q" id="q${i}"><div class="qt"><span class="qn">${n}</span><span>${q.t}</span></div>
        <select data-i="${i}"><option value="">My guess…</option>${a.choices.map((c,v)=>`<option value="${v}">${c}</option>`).join("")}</select></div>`;
    } else if (a.type === "reflect") {
      qs += `<div class="q" id="q${i}"><div class="qt"><span class="qn">${n}</span><span>${q.t}</span></div><textarea data-i="${i}"></textarea></div>`;
    }
  });
  const countrySel = a.country ? `<div class="q"><div class="qt"><span class="qn">★</span><span>Which country are you scoring?</span></div>
     <select id="cs"><option value="">Select…</option>${Object.keys(HOF).map(c=>`<option ${c===state.extra.country?"selected":""}>${c}</option>`).join("")}<option ${state.extra.country==="Other"?"selected":""}>Other</option></select>
     <div class="note">Choose a listed country to compare with its official Hofstede scores.</div></div>` : "";
  app.innerHTML = `
  <div class="crumb"><a id="back">← ${DAYS[a.day].name}</a> / ${a.id}</div>
  <div class="card">
    <div class="ahead"><span class="badge">${a.id}</span><h2>${a.title}</h2></div>
    <div class="instr">${a.instr}</div>
    <div class="progress"><i id="pg"></i></div><div class="note" id="pgt"></div>
  </div>
  ${countrySel}${qs}
  <div class="sticky"><div id="miss" class="status err hide"></div><button class="btn" id="score">See my result</button></div>`;
  document.getElementById("back").onclick = () => { state.view = "home"; render(); };
  const upd = () => {
    const n = a.type === "reflect" ? state.ans.filter(x=>x && x.trim()).length : state.ans.filter(x=>x!==null).length;
    document.getElementById("pg").style.width = (n / a.items.length * 100) + "%";
    document.getElementById("pgt").textContent = n + " of " + a.items.length + " answered";
  };
  app.querySelectorAll(".scale button,.opt").forEach(b=>b.onclick=()=>{
    const i = +b.dataset.i, v = +b.dataset.v;
    state.ans[i] = v;
    b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
    document.getElementById("q"+i).classList.remove("miss"); upd();
  });
  app.querySelectorAll("select[data-i]").forEach(s=>s.onchange=()=>{ state.ans[+s.dataset.i] = s.value === "" ? null : +s.value; document.getElementById("q"+s.dataset.i).classList.remove("miss"); upd(); });
  app.querySelectorAll("textarea[data-i]").forEach(t=>t.oninput=()=>{ state.ans[+t.dataset.i] = t.value; upd(); });
  const cs = document.getElementById("cs"); if (cs) cs.onchange = () => state.extra.country = cs.value;
  upd();
  document.getElementById("score").onclick = () => {
    let missing = [];
    if (a.type === "reflect") { if (!state.ans.some(x=>x && x.trim())) missing = [0]; }
    else state.ans.forEach((x,i)=>{ if (x === null) missing.push(i); });
    const m = document.getElementById("miss");
    if (missing.length) {
      missing.forEach(i=>document.getElementById("q"+i).classList.add("miss"));
      m.textContent = a.type === "reflect" ? "Please write at least one reflection." : "Please answer all questions (" + missing.length + " left).";
      m.classList.remove("hide");
      document.getElementById("q"+missing[0]).scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    finish(a);
  };
}

function finish(a){
  const r = SCORE[a.id](a, state.ans, state.extra);
  const u = getUser();
  const answersTxt = a.type === "reflect" ? [] : state.ans.map(v => a.type === "scale" ? v : a.type === "quiz" ? a.choices[v] : (a.type === "pair" ? "AB" : (a.letters || "ABCD"))[v]);
  const stored = {headline:r.headline, sub:r.sub, scores:r.scores, at:new Date().toISOString()};
  saveResult(a.id, stored);
  state.result = r; state.view = "result";
  render(); scrollTo(0,0);
  const payload = {
    course:CONFIG.COURSE, timestamp:new Date().toISOString(),
    name:u.name, email:u.email, org:u.org, group:u.group, homeCountry:u.country,
    day:a.day, assessmentId:a.id, assessment:a.title,
    result:r.headline, detail:r.sub, scores:r.scores,
    answers:answersTxt,
    tips:r.blocks.filter(b=>b.tip).map(b=>b.label + ": " + b.tip).join(" | ")
  };
  if (a.type === "reflect") { payload.reflection = {}; a.items.forEach((q,i)=>payload.reflection[q.k] = state.ans[i] || ""); }
  const st = document.getElementById("send");
  submit(payload).then(res => {
    if (!st) return;
    st.className = "status " + (res.ok ? "ok" : "wait");
    st.textContent = res.ok ? "✓ Your result has been sent to your trainer." : res.msg;
  });
}

function renderResult(){
  const a = A.find(x=>x.id===state.aid), r = state.result;
  const bars = (r.bars||[]).map(b=>{
    const pct = r.barsPct ? b[1] : Math.round(b[1] / b[2] * 100);
    const mark = b[3] != null ? `<em style="left:calc(${r.barsPct ? b[3] : Math.round(b[3]/b[2]*100)}% - 2px)" title="${r.barsPct ? "Official score" : "Threshold"}"></em>` : "";
    return `<div class="bar"><span>${b[0]}</span><span class="t"><i style="width:${Math.max(2,pct)}%"></i>${mark}</span><b>${r.barsPct ? b[1] : b[1]}</b></div>`;
  }).join("");
  const idx = A.findIndex(x=>x.id===a.id), next = A[idx+1];
  app.innerHTML = `
  <div class="crumb"><a id="back">← ${DAYS[a.day].name}</a> / ${a.id} / result</div>
  <div class="rhero" style="margin-top:12px"><div class="k">${a.id} · ${a.title}</div><h2>${esc(r.headline)}</h2><p>${esc(r.sub)}</p></div>
  <div id="send" class="status wait">Sending your result…</div>
  ${bars ? `<div class="rblock"><h3>Your scores</h3>${bars}${r.bars.some(b=>b[3]!=null)?`<div class="note">${r.barsPct ? "Gold marker = official Hofstede score" : "Gold marker = threshold for \"high\""}</div>`:""}</div>` : ""}
  ${r.blocks.map(b=>`<div class="rblock"><span class="chip">${esc(b.chip)}</span><h3>${esc(b.label)}</h3>${b.meaning?`<div>${esc(b.meaning)}</div>`:""}${b.tip?`<div class="tip"><b>Your tip:</b> ${esc(b.tip)}</div>`:""}</div>`).join("")}
  ${r.extraHTML || ""}
  <div class="row" style="margin:18px 0">
    <button class="btn ghost" id="again">Retake</button>
    ${next ? `<button class="btn" id="nx">Next: ${next.id} ${next.title} →</button>` : `<button class="btn" id="hm">Back to all assessments</button>`}
  </div>`;
  document.getElementById("back").onclick = () => { state.view = "home"; render(); };
  document.getElementById("again").onclick = () => openA(a.id);
  const nx = document.getElementById("nx"); if (nx) nx.onclick = () => openA(next.id);
  const hm = document.getElementById("hm"); if (hm) hm.onclick = () => { state.view = "home"; render(); };
}

/* deep links: ?d=2 opens a day, ?a=2.1 opens an assessment, ?g=Cohort pre-fills the group */
(function init(){
  const p = new URLSearchParams(location.search);
  if (p.get("d") && DAYS[p.get("d")]) state.day = +p.get("d");
  render();
  const aid = p.get("a");
  if (aid && A.find(x=>x.id===aid) && getUser()) openA(aid);
  window.addEventListener("online", flush);
})();
</script>
</body>
</html>
